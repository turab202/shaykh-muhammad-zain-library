name: Import from Telegram

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual trigger

concurrency:
  group: telegram-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r telegram/requirements.txt

      - name: Check secrets
        run: |
          for secret in DATABASE_URL TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_PHONE TELEGRAM_CHANNEL TELEGRAM_SESSION_BASE64; do
            if [ -z "${!secret}" ]; then echo "❌ Missing: $secret"; exit 1; fi
          done
          echo "✓ All secrets present"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_SESSION_BASE64: ${{ secrets.TELEGRAM_SESSION_BASE64 }}

      - name: Restore session
        run: |
          mkdir -p telegram/.session
          echo "${{ secrets.TELEGRAM_SESSION_BASE64 }}" | base64 -d > telegram/.session/importer.session
          echo "Session restored: $(wc -c < telegram/.session/importer.session) bytes"

      - name: Import new lessons from Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_PROXY_CHANNEL_ID: ${{ secrets.TELEGRAM_PROXY_CHANNEL_ID }}
        run: |
          python -m telegram.importer.importer \
            --live --limit 50 --no-media --auto-publish || true
          echo "Import complete"

      - name: Save session for next run
        if: always()
        run: |
          if [ -f telegram/.session/importer.session ]; then
            echo "::notice title=Session::Update TELEGRAM_SESSION_BASE64 with: $(base64 -w0 telegram/.session/importer.session)"
          fi
